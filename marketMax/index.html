<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>MyMusic</title>
        <link rel="stylesheet" href="./styles/style.css" type="text/css">
        <!-- defer загрузит JS-файл только после загрузки body -->
        <script defer src="./js/main.js"></script>
    </head>
    <body>
        <header>
            <img class="logo" src="./images/logo.jpg" alt="logo">
            <div class="title">
                <h1>My Music</h1>
                <h3>Интернет магазин электрогитар</h3>
            </div>
            <a href="#" id="cart" title="корзина">
                <img src="./images/cart.svg">
                <span id="cartCounter">0</span>
            </a>
        </header>
        <div id="filter">
            <div>
                <input id="search" type="text">
                <img src="./images/search.svg" id="searchButton">
            </div>
        </div>
        <main>
            <p>карточки товаров</p>
        </main>
        <footer>
            <p>Информация о магазине</p>
        </footer>
    </body>
</html>
